<!DOCTYPE html>
<html>
<head>
<title>My Developer Card</title>
</head>

<body>

  <h1> Bhanu Pratap</h1>
  
  <p>Aspiring Developer 🚀</p>
  
  <h2>Currently Learning</h2>

  <ul>
    <li>HTML and CSS</li>
    <li>Java and C++</li>
    <li>JavaScript</li>
  </ul>
  
  <button id="helloButton">Say Hello</button>
  <p id="message">You clicked the button 0 times.</p>

  <script>
    const button = document.getElementById("helloButton");
    const message = document.getElementById("message");

    let clickCount = 0;
    
    button.addEventListener("click", function() {
      clickCount = clickCount + 1;

      if (clickCount<=2){
      message.textContent = "👋 Hello! Welcome to my Development Journey! You clicked this button " +clickCount + " times. Go for more clicks👆";
      } else if (clickCount<=5){
      message.textContent = "👋 Hello! Welcome to my Development Journey! You clicked this button " +clickCount + " times. Nice! Keep Going! 🔥";
      } else {
      message.textContent = "👋 Hello! Welcome to my Development Journey! You clicked this button " +clickCount + " times. Whoa! You're on a roll! 🚀";
      }
      
      });
  </script>

</body>
</html>
